<body>
<script src="../lib/engine.js?v=d6885892"></script>
<script src="../lib/mm5.js?v=8ee61e1a"></script>
<script src="../lib/embed.js?v=3bc13d2d"></script>
<script src="audio/en/timings.js?v=d3ef214c"></script>
<script>
'use strict';
/* Mr. O's 4th grade · Math Module 5, Lesson 5.3: multiply a big number by its parts.
   Drawn the way HIS board writes it (his Test Review: "6 × 8,000 = 48,000" then "6 × 400 = 2,400" as lines under the
   problem; the site's picture for this kind: "3 × 4,000 = ?", "3 × 200 = ?", "3 × 4,200 = ?"), in the numbered lines
   of his board, with his Module 4 way for each part: "Cover the zeros" (the sticky note), the basic fact (teal card
   under the part), "Put back the zeros" (the note lifts; the fact's digits come up, the zeros come along in orange).
     3 × 4,200 · 1  4,200 = 4,000 + 200 · 2  3 × 4,000 = 12,000 (3 × 4 = 12), 3 × 200 = 600 (3 × 2 = 6)
     3  12,000 + 600 = 12,600
   The 4,000 part is blue and the 200 part green all the way down (GROUP[0] / GROUP[1]).
   Two beats share one board: 'parts' (step 1) and 'steps' (steps 2 and 3).
   The trap (her words): stopping at the first part — 3 × 4,200 = 12,000. */
const CHAPTER = { number: 5, title: 'Multiply by parts', minutes: 1, language: 'en' };

/* HIS BOARD: the problem at the top left, then numbered lines under it, each number in a teal circle */
const BX = 340, LX = BX + 64 * .48 + 34, PX = BX - 30;       // the circles' centre, where the lines start, the problem
const PROB_Y = 150, L1_Y = 290, L2_Y = 410, FACT_Y = 512, L3_Y = 640, ANS_Y = 768;
const TENS = GROUP[0], ONES = GROUP[1];                       // the 4,000 part, the 200 part
const PSZ = 58;                                               // the products and their facts

// the kit's sticky note over the zeros (piece k), set right so it does not hide the end of the digit before
// (as Math Module 4 did; at its .06 the note still nipped the 4 and the 2), dropping on at t0 and lifting off at t1
const c05Cover = (line, k, t0, t1) => { const n = dCover(line, k, k, t0, t1); put(n, { x: st(n).x + line.row.size * .16 }); return n; };
// his red ring round an answer in a line (piece e, baseline y): an ellipse through the digits' corners and a little
// more, so it never cuts a digit
const c05Ring = (p, e, y, size, t) => {
  const a = e._w / 2, b = size * .36, rx = a + 22, ry = b / Math.sqrt(1 - (a / rx) ** 2) + 8;
  return dRing(p, e._px, y - size * .35, rx * 2, ry * 2, t);
};

const BEATS = [
  ['intro', 'Multiply by parts', titleBeat('Lesson 5.3', 'Multiply by parts', 'Big numbers, one part at a time.')],

  ['parts', 'Break apart', (m) => {
    const p = panel(0);
    // "Here is three times four thousand two hundred."
    S.prob = dLine(p, ['3', ' × ', '4,200'], PX, PROB_Y, .3, { size: 96, card: BLUE_BG, anchor: 'start' });
    // "Step one. Break apart four thousand two hundred. Four thousand plus two hundred."
    const l1 = S.l1 = dStepLine(p, 1, ['4,200', ' = ', { t: '4,000', fill: TENS }, ' + ', { t: '200', fill: ONES }], BX, L1_Y, m('s1'), { size: 64 });
    dLater(l1, [0, 1], m('s1', 2.1));                                         // "four thousand two hundred"
    dLater(l1, [2], m('ef'));                                                 // "Four thousand"
    dLater(l1, [3], m('ef', .9));                                             // "plus"
    dLater(l1, [4], m('ef', 1.24));                                           // "two hundred"
  }],

  ['steps', 'Multiply each part', (m) => {
    const p = S.panel, prob = S.prob, l1 = S.l1;                             // the same board
    // "Step two. Multiply each part by three."
    dBadge(p, 2, BX, L2_Y - 64 * .34, m('s2'), { r: 64 * .48 });
    dNudge(l1.row[2], m('s2', 2.09)); dNudge(l1.row[4], m('s2', 2.44));     // "each part"
    dNudge(prob.row[0], m('s2', 2.99));                                      // "by three"

    // "Three times four thousand."
    const a = dLine(p, ['3 × ', { t: '4', fill: TENS }, { t: ',000', fill: TENS }, ' = ', { t: '12', fill: TENS }, { t: ',000', fill: ORANGE }],
      LX, L2_Y, m('p1'), { size: PSZ, anchor: 'start' });
    dLater(a, [1, 2], m('p1', .88));
    // "Cover the zeros." … "Put back the zeros." — his sticky note on the 4,000's zeros
    c05Cover(a, 2, m('cv1', .4), m('z1', .3));
    // "Three times four is twelve." — the fact on a teal card under it, its 3 × 4 under the 3 × 4
    const fa = dLine(p, ['3 × ', { t: '4', fill: TENS }, ' = ', '12'], LX, FACT_Y, m('cv1', 1.69), { size: PSZ, card: TEAL_BG, anchor: 'start' });
    dNudge(a.row[1], m('cv1', 2.43));                                         // "four"
    dLater(fa, [2], m('cv1', 2.71)); dLater(fa, [3], m('cv1', 2.88));        // "is twelve"
    // "Put back the zeros. Twelve thousand." — the 12 comes up from the fact, the zeros come along from the 4,000
    dLater(a, [3, 4], m('z1', .1)); dFly(a, [4], [fa.row[3]._px, fa.row.y], m('z1', .1), .7);
    dLater(a, [5], m('z1', .64)); dFly(a, [5], [a.row[2]._px, a.row.y], m('z1', .64), .8);
    dNudge(a.row[4], m('z1', 1.79)); dNudge(a.row[5], m('z1', 1.85));        // "Twelve thousand"

    // "Three times two hundred."
    const xB = LX + a.row.w + 110;
    const b = dLine(p, ['3 × ', { t: '2', fill: ONES }, { t: '00', fill: ONES }, ' = ', { t: '6', fill: ONES }, { t: '00', fill: ORANGE }],
      xB, L2_Y, m('p2'), { size: PSZ, anchor: 'start' });
    dLater(b, [1, 2], m('p2', .84));
    // "Cover the zeros." … "Put back the zeros."
    c05Cover(b, 2, m('cv2', .4), m('z2', .3));
    // "Three times two is six."
    const fb = dLine(p, ['3 × ', { t: '2', fill: ONES }, ' = ', '6'], xB, FACT_Y, m('cv2', 1.69), { size: PSZ, card: TEAL_BG, anchor: 'start' });
    dNudge(b.row[1], m('cv2', 2.57));                                         // "two"
    dLater(fb, [2], m('cv2', 2.8)); dLater(fb, [3], m('cv2', 2.95));         // "is six"
    // "Put back the zeros. Six hundred."
    dLater(b, [3, 4], m('z2', .1)); dFly(b, [4], [fb.row[3]._px, fb.row.y], m('z2', .1), .7);
    dLater(b, [5], m('z2', .64)); dFly(b, [5], [b.row[2]._px, b.row.y], m('z2', .64), .8);
    dNudge(b.row[4], m('z2', 1.79)); dNudge(b.row[5], m('z2', 1.85));        // "Six hundred"

    // "Step three. Add. Twelve thousand plus six hundred is twelve thousand six hundred." — the products come down
    const l3 = dStepLine(p, 3, [{ t: '12,000', fill: TENS }, ' + ', { t: '600', fill: ONES }, ' =  ', '12,600'], BX, L3_Y, m('s3'), { size: 64 });
    dLater(l3, [0], m('sum')); dFly(l3, [0], [(a.row[4]._px + a.row[5]._px) / 2, a.row.y], m('sum'), .8);
    dLater(l3, [1], m('sum', .97));
    dLater(l3, [2], m('sum', 1.28)); dFly(l3, [2], [(b.row[4]._px + b.row[5]._px) / 2, b.row.y], m('sum', 1.28), .8);
    dLater(l3, [3], m('sum', 2.2));
    dLater(l3, [4], m('sum', 2.46));
    // his red ring round the answer as she says it, then the answer under his lines
    c05Ring(p, l3.row[4], L3_Y, 64, m('sum', 2.46));
    dLine(p, ['3 × 4,200 = 12,600'], PX, ANS_Y, m('sum', 3.2), { size: 72, card: ORANGE_BG, anchor: 'start' });
  }],

  ['mistake', 'Watch out', (m) => {
    const p = panel(0);
    dWatchOut(p, .3, 800, 100);
    // "Multiply both parts."
    dText(p, 'Multiply both parts.', 800, 190, m('w'), { size: 44, fill: INK });
    // the right one on top: "Add the six hundred too. It is twelve thousand six hundred." — then the ✓
    const r = dLine(p, [{ t: '12,000', fill: TENS }, ' + ', { t: '600', fill: ONES }, ' = ', '12,600'], 770, 345, m('add'), { size: 64, card: ORANGE_BG });
    dLater(r, [1, 2], m('add', .37));                                         // "the six hundred"
    dLater(r, [3, 4], m('right', .4));                                        // "twelve thousand six hundred"
    dTick(p, r._card.x + r._card.w + 44, 345 - 64 * .3, m('right', 1.9));
    // the mistake under it: "Twelve thousand is only the first part." — 12,000 slashed
    const bad = dLine(p, ['3 × 4,200 = ', { t: '12,000', fill: RED }], 800, 545, m('not'), { size: 64, card: RED_BG });
    dSlash(p, bad.row[1]._px, 545 - 64 * .36, bad.row[1]._w + 24, 64 * .95, m('not', .5));
    dNote(p, '12,000 is only the first part.', 800, 655, m('not', 1.0));
  }, { minDur: 13.3 }],

  ['wrap', 'Remember', rememberBeat([['Break apart.', 'w1'], ['Multiply each part.', 'w2'], ['Add.', 'w3']])],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
